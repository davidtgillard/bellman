name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bellman
        uses: actions/checkout@v4

      - name: Checkout pyfits (sibling editable dependency)
        run: git clone --depth 1 https://github.com/davidtgillard/pyfits.git ../pyfits.git

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Fetch libfits for pyfits
        run: python ../pyfits.git/scripts/fetch_libfits.py

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Pyright
        run: uv run basedpyright

      - name: Pytest with coverage
        run: uv run pytest
