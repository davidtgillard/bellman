name: Release dev

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout bellman
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Write embedded build version
        run: uv run python packaging/write_build_version.py

      - name: Resolve libfits for bundling
        run: |
          set -euo pipefail
          libfits="$(uv run python packaging/resolve_libfits.py)"
          echo "LIBFITS_PATH=${libfits}" >> "${GITHUB_ENV}"

      - name: Build PyInstaller binary
        run: uv run pyinstaller packaging/bellman.spec --noconfirm

      - name: Package release artifacts
        run: |
          set -euo pipefail
          version="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          mkdir -p dist/release
          cp dist/bellman "dist/release/bellman-${version}-linux-x86_64"
          chmod +x "dist/release/bellman-${version}-linux-x86_64"
          (cd dist/release && sha256sum "bellman-${version}-linux-x86_64" > "bellman-${version}-linux-x86_64.sha256")

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bellman-binary
          path: dist/release/*

  publish-dev-release:
    name: Publish dev release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: bellman-binary
          path: release

      - name: Ensure dev release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create dev \
            --repo "$GITHUB_REPOSITORY" \
            --title "Development binaries" \
            --notes "Rolling development PyInstaller binaries for bellman (linux-x86_64)." \
            --prerelease

      - name: Remove existing dev assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id' | while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

      - name: Upload fresh dev binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload dev release/* --repo "$GITHUB_REPOSITORY"
