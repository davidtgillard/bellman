name: Release dev

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build binary (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-latest
          - id: windows-x86_64
            os: windows-latest
          - id: macos-arm64
            os: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout bellman
        uses: actions/checkout@v4

      - name: Checkout pyfits (sibling editable dependency)
        shell: bash
        run: git clone --depth 1 https://github.com/davidtgillard/pyfits.git ../pyfits.git

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        shell: bash
        run: uv python install

      - name: Install dependencies
        shell: bash
        run: uv sync --all-groups

      - name: Fetch libfits for pyfits
        shell: bash
        run: python ../pyfits.git/scripts/fetch_libfits.py

      - name: Write embedded build version
        shell: bash
        run: uv run python packaging/write_build_version.py

      - name: Resolve libfits for bundling
        shell: bash
        run: |
          set -euo pipefail
          libfits="$(uv run python packaging/resolve_libfits.py)"
          echo "LIBFITS_PATH=${libfits}" >> "${GITHUB_ENV}"

      - name: Build PyInstaller binary
        shell: bash
        run: uv run pyinstaller packaging/bellman.spec --noconfirm

      - name: Package release artifacts
        shell: bash
        run: uv run python packaging/package_release.py --platform "${{ matrix.id }}"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bellman-binary-${{ matrix.id }}
          path: dist/release/*
          if-no-files-found: error

  publish-dev-release:
    name: Publish dev release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bellman-binary-*
          path: release
          merge-multiple: true

      - name: Ensure dev release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create dev \
            --repo "$GITHUB_REPOSITORY" \
            --title "Development binaries" \
            --notes "Rolling development PyInstaller binaries for bellman (linux-x86_64, windows-x86_64, macos-arm64)." \
            --prerelease

      - name: Remove existing dev assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id' | while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

      - name: Upload fresh dev binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under release/" >&2
            exit 1
          fi
          gh release upload dev "${assets[@]}" --repo "$GITHUB_REPOSITORY"
