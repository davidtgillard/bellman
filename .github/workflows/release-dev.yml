name: Release dev

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout snark
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Build wheel
        run: |
          mkdir -p wheelhouse
          uv build --wheel --out-dir wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snark-wheelhouse
          path: wheelhouse/*.whl

  publish-dev-release:
    name: Publish dev release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: snark-wheelhouse
          path: wheelhouse

      - name: Ensure dev release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create dev \
            --repo "$GITHUB_REPOSITORY" \
            --title "Development wheels" \
            --notes "Rolling development wheels for snark." \
            --prerelease

      - name: Remove existing dev assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" --jq '.id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id' | while read -r asset_id; do
            [ -n "$asset_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

      - name: Upload fresh dev wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload dev wheelhouse/*.whl --repo "$GITHUB_REPOSITORY"
